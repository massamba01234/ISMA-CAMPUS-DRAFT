<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ISMA Campus — Connection</title>
    <style>
        :root{
            --bg:#f4f7fb; --card:#fff; --accent:#2b6ef6; --muted:#6b7280;
            --danger:#ef4444;
        }
        *{box-sizing:border-box}
        body{
            margin:0; font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
            background:linear-gradient(180deg, #eef5ff 0%, var(--bg) 100%); color:#111;
            min-height:100vh; display:grid; place-items:center;
        }
        .container{
            width:100%; max-width:420px; padding:28px;
        }
        .card{
            background:var(--card); border-radius:12px; box-shadow:0 8px 30px rgba(16,24,40,.08);
            padding:28px;
        }
        header{display:flex; gap:12px; align-items:center; margin-bottom:18px}
        .logo{
            width:44px; height:44px; border-radius:8px; background:linear-gradient(135deg,var(--accent),#6b9bff);
            display:grid; place-items:center; color:#fff; font-weight:700; letter-spacing:.6px;
        }
        h1{font-size:18px; margin:0}
        p.lead{margin:6px 0 0; color:var(--muted); font-size:13px}
        form{margin-top:14px}
        label{display:block; font-size:13px; margin-bottom:6px; color:var(--muted)}
        .field{
            display:flex; align-items:center; gap:8px; background:#fbfdff; border:1px solid #e6eefb;
            padding:10px 12px; border-radius:8px; margin-bottom:12px;
        }
        input[type="email"], input[type="password"]{
            border:0; outline:0; font-size:15px; width:100%; background:transparent;
        }
        .actions{display:flex; justify-content:space-between; align-items:center; margin-top:6px}
        .btn{
            background:var(--accent); color:#fff; border:0; padding:10px 14px; border-radius:10px; cursor:pointer;
            font-weight:600; box-shadow:0 6px 16px rgba(43,110,246,.12);
        }
        .link{color:var(--accent); text-decoration:none; font-size:14px}
        .muted{color:var(--muted); font-size:13px}
        .helper{font-size:13px; color:var(--muted); margin-top:12px}
        .error{color:var(--danger); font-size:13px; margin-top:6px}
        .row{display:flex; gap:8px}
        .remember{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
        .toggle{
            background:transparent; border:0; color:var(--muted); cursor:pointer; padding:6px; border-radius:6px;
        }
        footer{margin-top:14px; text-align:center; font-size:13px; color:var(--muted)}
        @media (max-width:420px){ .container{padding:16px} }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" role="main" aria-labelledby="conn-title">
            <header>
                <div class="logo">
                    <img src="./ISMA_1.jpg" alt="ISMA logo" style="width:100%;height:100%;border-radius:8px;object-fit:cover;display:block;" />
                </div>
                <div>
                    <h1 id="conn-title">Welcome to ISMA Campus</h1>
                    <p class="lead">Sign in to continue to your dashboard</p>
                </div>
            </header>

            <form id="loginForm" action="login.php" method="post" novalidate>
                <div>
                    <label for="email">Email</label>
                    <div class="field">
                        <input id="email" name="email" type="email" placeholder="you@domain.com" required autocomplete="email" />
                    </div>
                </div>

                <div>
                    <label for="password">Password</label>
                    <div class="field">
                        <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
                        <button type="button" class="toggle" id="togglePwd" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="actions">
                    <label class="remember">
                        <input type="checkbox" name="remember" />
                        Remember me
                    </label>
                    <a class="link" href="forgot-password.html">Forgot?</a>
                </div>

                <div style="margin-top:14px; display:flex; gap:8px;">
                    <button type="submit" class="btn">Sign in</button>
                    <a href="register.html" class="link" style="align-self:center; margin-left:auto">Create account</a>
                </div>

                <div id="msg" role="status" aria-live="polite" class="helper"></div>
            </form>

            <footer>
                By continuing you agree to ISMA Campus policies.
            </footer>
        </div>
    </div>

    <script>
        // Basic client-side validation + show/hide password
        (function(){
            const form = document.getElementById('loginForm');
            const email = document.getElementById('email');
            const pwd = document.getElementById('password');
            const msg = document.getElementById('msg');
            const toggle = document.getElementById('togglePwd');

            toggle.addEventListener('click', () => {
                const isPwd = pwd.type === 'password';
                pwd.type = isPwd ? 'text' : 'password';
                toggle.textContent = isPwd ? 'Hide' : 'Show';
                toggle.setAttribute('aria-pressed', String(isPwd));
            });

            form.addEventListener('submit', (e) => {
                msg.textContent = '';
                // simple checks
                if (!email.value.trim()) {
                    e.preventDefault();
                    msg.textContent = 'Please enter your email.';
                    msg.className = 'error';
                    email.focus();
                    return;
                }
                if (!/\S+@\S+\.\S+/.test(email.value)) {
                    e.preventDefault();
                    msg.textContent = 'Please enter a valid email address.';
                    msg.className = 'error';
                    email.focus();
                    return;
                }
                if (!pwd.value.trim()) {
                    e.preventDefault();
                    msg.textContent = 'Please enter your password.';
                    msg.className = 'error';
                    pwd.focus();
                    return;
                }
                // show subtle submitting state (actual auth handled by login.php)
                msg.textContent = 'Signing in…';
                msg.className = 'helper';
            });
        })();
    </script>
</body>
</html></div>
