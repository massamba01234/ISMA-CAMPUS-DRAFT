<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 — Page Not Found</title>
    <style>
        :root{
            --bg:#0f1724;
            --card:#0b1220;
            --accent:#6ee7b7;
            --muted:#9aa6b2;
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background:linear-gradient(180deg, #071025 0%, var(--bg) 100%);
            color:#e6eef6;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .card{
            width:100%;
            max-width:920px;
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border:1px solid rgba(255,255,255,0.04);
            border-radius:14px;
            padding:40px;
            display:flex;
            gap:32px;
            align-items:center;
            box-shadow:0 8px 30px rgba(2,6,23,0.6);
        }
        .graphic{
            width:220px;
            flex:0 0 220px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        svg{width:160px;height:160px;display:block}
        .content{
            flex:1;
        }
        h1{
            margin:0 0 8px 0;
            font-size:48px;
            line-height:1;
            letter-spacing:-1px;
        }
        p{margin:0 0 18px 0;color:var(--muted);}
        .actions{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }
        .btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            text-decoration:none;
            padding:10px 14px;
            border-radius:10px;
            background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            color:var(--accent);
            border:1px solid rgba(110,231,183,0.12);
            font-weight:600;
            cursor:pointer;
        }
        .btn.secondary{
            color:#bcd3e0;
            background:transparent;
            border:1px solid rgba(255,255,255,0.04);
            font-weight:500;
        }
        .hint{color:var(--muted);font-size:13px;margin-top:14px}
        @media (max-width:720px){
            .card{flex-direction:column;align-items:stretch;padding:28px}
            .graphic{width:100%;order:2}
            svg{width:140px;height:140px;margin:0 auto}
        }
        .pulse{
            animation:pulse 1.8s infinite ease-in-out;
        }
        @keyframes pulse{
            0%{transform:translateY(0)}
            50%{transform:translateY(-6px)}
            100%{transform:translateY(0)}
        }
    </style>
</head>
<body>
    <main class="card" role="main" aria-labelledby="title">
        <div class="graphic" aria-hidden="true">
            <!-- Simple SVG illustration -->
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="pulse">
                <defs>
                    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                        <stop offset="0" stop-color="#6ee7b7"/>
                        <stop offset="1" stop-color="#60a5fa"/>
                    </linearGradient>
                </defs>
                <rect x="6" y="6" width="108" height="108" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)"/>
                <g transform="translate(20,22)">
                    <circle cx="34" cy="28" r="18" fill="url(#g)" opacity="0.14"/>
                    <path d="M14 60c0-14 18-28 36-18" stroke="#8fd8c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M58 18c4 4 2 10-3 14" stroke="#8fb7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="36" cy="28" r="2.75" fill="#9be7c6"/>
                </g>
                <text x="60" y="102" text-anchor="middle" fill="rgba(255,255,255,0.06)" font-family="Inter, Arial" font-size="10">ISM A Campus</text>
            </svg>
        </div>

        <div class="content">
            <h1 id="title">404 — Page not found</h1>
            <p>Sorry — the page you’re looking for doesn’t exist or has been moved. Check the URL or try one of the options below.</p>

            <div class="actions">
                <a class="btn" href="./index.html" title="Go to homepage">Go to homepage</a>
                <button class="btn secondary" onclick="history.back()">Go back</button>
                
            </div>

            <p class="hint">If you arrived here from a bookmarked page, it may be out of date. Contact the site administrator if the problem persists.</p>
        </div>
    </main>

    <script>
        // Simple site search: if your site has a search endpoint, change `searchUrl`.
        // Otherwise this falls back to a Google site: search (useful for public sites).
        const searchUrl = '/search?q='; // adjust if your site provides search
        function siteSearch(e){
            e.preventDefault();
            const q = (document.getElementById('q').value || '').trim();
            if(!q) return false;
            // Try internal search first, otherwise fallback to Google site search
            if(searchUrl){
                // navigate to site search (works if you implement /search)
                window.location.href = searchUrl + encodeURIComponent(q);
            } else {
                window.location.href = 'https://www.google.com/search?q=site:' + location.hostname + '+' + encodeURIComponent(q);
            }
            return false;
        }
    </script>
</body>
</html></form>
